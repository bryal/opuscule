[package]
name = "opuscule"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "opus_compare"

[[bin]]
name = "opus_demo"

[features]
default = ["std"]
# Use the standard library (and its system math for the float build). Turn off
# (`--no-default-features`) for a no_std build; then either `fixed-point`
# (integer kernels, no math dep) or `libm` (pure-Rust float math) is required.
std = []
# Fixed-point decoder: integer kernels only, no float math — no_std for free.
fixed-point = []
# Pure-Rust float math via the `libm` crate, for a no_std floating-point build.
libm = ["dep:libm"]

[lints.clippy]
# Exceptions: lints we find tend to make this codebase worse, not better.
len_zero = "allow"
len_without_is_empty = "allow"
too-many-arguments = "allow"
bool_assert_comparison = "allow"
assign_op_pattern = "allow"
unit_arg = "allow"

# Promoted to errors: a bare panic-on-failure or unchecked index hides *why*
# it can't fail and gives no context if it ever does.
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"

[dependencies]
libm = { version = "0.2", optional = true }

[dev-dependencies]
# Test targets link `std` regardless (the test harness needs it), so build the
# crate with `std` for them. This keeps `--all-targets` honest under a no_std
# feature set (e.g. `--no-default-features --features libm`): without it the lib
# is compiled with std present but the `std` feature off, spuriously flagging
# `arch::FloatMath` as unused. Real *library* no_std builds don't pull
# dev-dependencies, so they stay genuinely no_std.
opuscule = { path = ".", features = ["std"] }
# For the `play` example only (OGG demux + audio output). Dev-dependencies
# never reach library consumers. rodio defaults pull in format decoders we
# don't need (we feed it raw PCM), so take just the playback path.
ogg = "0.9"
# default features include format decoders (flac/vorbis/mp3/symphonia/...) we
# don't use - we feed raw PCM - so take just the playback path.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
