[package]
name = "opuscule"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "opus_compare"

[[bin]]
name = "opus_demo"

[features]
fixed-point = []

[lints.clippy]
# Exceptions: lints we find tend to make this codebase worse, not better.
len_zero = "allow"
len_without_is_empty = "allow"
too-many-arguments = "allow"
bool_assert_comparison = "allow"
assign_op_pattern = "allow"
unit_arg = "allow"

# Promoted to errors: a bare panic-on-failure or unchecked index hides *why*
# it can't fail and gives no context if it ever does.
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"

[dependencies]

[dev-dependencies]
